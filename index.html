<!DOCTYPE html>
<html>
<head>
  <base href="/416flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="416 Records — Films, musique, une seule maison.">
  <meta name="theme-color" content="#040406">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="416 Records">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>416 Records</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; background: #040406; height: 100%; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #040406;
      z-index: 9999; transition: opacity 0.5s; font-family: Inter, system-ui, sans-serif;
    }
    #splash .logo {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #9D68FF, #734AC3);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 1px;
      box-shadow: 0 10px 40px -10px rgba(115, 74, 195, 0.55);
    }
    #splash .brand { margin-top: 18px; color: #F8F8F8; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    #splash .tag { margin-top: 4px; color: #9E9DA4; font-size: 13px; }
    #splash .bar { margin-top: 26px; width: 160px; height: 3px; border-radius: 3px; background: #16151C; overflow: hidden; }
    #splash .bar .fill {
      height: 100%; width: 40%; border-radius: 3px;
      background: linear-gradient(135deg, #9D68FF, #734AC3);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">416</div>
    <div class="brand">416 Records</div>
    <div class="tag">Films, musique, une seule maison.</div>
    <div class="bar"><div class="fill"></div></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 500); }
    });
  </script>
</body>
</html>
